<section id="threshold" class="threshold" aria-labelledby="thresholdTitle" hidden>
  <!-- A minimal stage poster (2026-11-24): a flat wall, one thin floor line, and only four subjects —
       the traveller, the letter, the door, the shadow. Light comes from the audience, low and to the left,
       so the traveller's shadow falls large on the wall behind them, up and to the right. -->
  <svg class="th-stage" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="thPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFFBF2" stop-opacity=".85"/><stop offset="1" stop-color="#FFFBF2" stop-opacity="0"/></radialGradient>
      <radialGradient id="thLetter" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
      <linearGradient id="thSpill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="th-spill-a"/><stop offset="1" class="th-spill-b"/></linearGradient>
      <filter id="thSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="thSofter" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
      <!-- The shadow: the traveller's own outline, warm near-black, edges only slightly softened. -->
      <filter id="thShadowF" x="-10%" y="-10%" width="120%" height="120%">
        <feColorMatrix type="matrix" values="0 0 0 0 .282  0 0 0 0 .263  0 0 0 0 .243  0 0 0 1 0"/><feGaussianBlur stdDeviation="2.6"/>
      </filter>
      <clipPath id="thDoorway"><rect x="1094" y="392" width="130" height="438"/></clipPath>
      <radialGradient id="thWash" cx="1160" cy="610" r="980" gradientUnits="userSpaceOnUse"><stop offset="0" class="th-wash-a"/><stop offset=".55" class="th-wash-m"/><stop offset="1" class="th-wash-b"/></radialGradient>
    </defs>

    <!-- Wall and floor. -->
    <rect x="0" y="0" width="1440" height="900" fill="#ECE9E3"/>
    <rect x="0" y="830" width="1440" height="70" fill="#D8D3CA"/>
    <path d="M0 830 H1440" stroke="#BDB7AD" stroke-width="1.5"/>
    <ellipse cx="560" cy="842" rx="300" ry="34" fill="url(#thPool)"/>
    <!-- When the door opens, the next Universe's light washes over the wall and the floor. -->
    <rect class="th-wash" x="0" y="0" width="1440" height="900" fill="url(#thWash)"/>

    <!-- The Universes already crossed: small closed doors along the wall, framed in each world's colour. -->
    <g id="thPast" class="th-past"></g>

    <!-- The door: a dark outline; its only colour is the next Universe's light at the gap. -->
    <g class="th-door">
      <rect x="1076" y="374" width="166" height="456" fill="#E2DED6"/>
      <path class="th-spill" d="M1094 830 L1224 830 L1256 900 L1000 900 Z" fill="url(#thSpill)" filter="url(#thSofter)"/>
      <rect x="1094" y="392" width="130" height="438" fill="#2E2B28"/>
      <g clip-path="url(#thDoorway)">
        <image id="thNextArt" href="" x="960" y="392" width="400" height="438" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <rect class="th-glow" x="1092" y="394" width="12" height="434" filter="url(#thSoft)" opacity=".9"/>
      <path d="M1090 830 V388 H1228 V830" fill="none" stroke="#5E5A55" stroke-width="8"/>
      <!-- The leaf opens outward, toward us, on hinges at the right jamb: in front of the frame, and its free edge
           grows as it comes nearer (local-api.js sets the points; a fixed perspective from the stage's centre). -->
      <g class="th-leaf">
        <polygon id="thLeaf" points="1114,386 1224,392 1224,830 1114,839" fill="#D6D2CB"/>
        <line id="thLeafEdge" x1="1114" y1="386" x2="1114" y2="839" stroke="#BDB7AD" stroke-width="3"/>
        <circle id="thKnob" cx="1128" cy="620" r="4.5" fill="#5E5A55"/>
      </g>
    </g>

    <!-- Finale: the five doors of the journey side by side, behind the shadow and the traveller. Filled when all five Universes are crossed. -->
    <g id="thFinale" class="th-finale"></g>

    <!-- The shadow on the wall: larger than the traveller, behind them, up and to the right. -->
    <g class="th-shadow" opacity=".7" filter="url(#thShadowF)"><image href="art/traveller.webp" x="566" y="286" width="370" height="544"/></g>

    <!-- The traveller, lit from the front, holding the letter. -->
    <g class="th-walker"><g class="th-bobber"><g class="th-tilt">
      <image href="art/traveller.webp" x="442.5" y="542" width="197" height="290"/>
      <circle cx="601" cy="667" r="30" fill="url(#thLetter)" opacity=".55"/>
      <circle class="th-glowpulse" cx="601" cy="667" r="44" fill="url(#thLetter)"/>
      <circle id="thSeal" class="th-seal" cx="605" cy="675" r="5.6"/>
    </g></g></g>

    <!-- Closing panel (finale only): falls over the stage at the end of the journey. -->
    <g class="th-front"><rect x="0" y="-20" width="1440" height="940" fill="#24221F"/></g>
  </svg>
  <div class="th-ui">
    <div class="th-top"><span class="th-mark">TRANSVERSE</span><span class="th-sub">BETWEEN UNIVERSES</span></div>
    <div class="th-end" id="thEnd" hidden>
      <h2>The journey ends here</h2>
      <p>Thank you for travelling through the five universes.</p>
      <div class="th-end-actions"><button id="thExport" type="button">Export your record</button><a href="../">Back to the start</a><button id="thClose" type="button">Back to the game</button></div>
    </div>
    <span class="th-wait" id="thWait" role="status" hidden>Preparing the next world…</span>
    <div class="th-bottom"><span class="th-where" id="thresholdTitle">UNIVERSE 01 / 05</span><button id="thresholdOpen" type="button">Open the door</button></div>
  </div>
</section>
