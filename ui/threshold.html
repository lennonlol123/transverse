<section id="threshold" class="threshold" aria-labelledby="thresholdTitle" hidden>
  <svg class="th-stage" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="thFold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#C9C4BA"/><stop offset=".32" stop-color="#E8E5DE"/><stop offset=".58" stop-color="#D6D1C7"/><stop offset="1" stop-color="#BEB8AD"/>
      </linearGradient>
      <pattern id="thCurtain" width="72" height="640" patternUnits="userSpaceOnUse"><rect width="72" height="640" fill="url(#thFold)"/></pattern>
      <linearGradient id="thHem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
      <radialGradient id="thSpot" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#FFFDF6" stop-opacity=".92"/><stop offset=".72" stop-color="#FFF9EC" stop-opacity=".7"/><stop offset="1" stop-color="#FFF9EC" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="thDim" cx=".46" cy=".5" r=".78">
        <stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
      </radialGradient>
      <linearGradient id="thFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A29A8E"/><stop offset="1" stop-color="#6A645B"/></linearGradient>
      <radialGradient id="thPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF4DE" stop-opacity=".7"/><stop offset="1" stop-color="#FFF4DE" stop-opacity="0"/></radialGradient>
      <radialGradient id="thLetter" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient>
      <linearGradient id="thSpill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="th-spill-a"/><stop offset="1" class="th-spill-b"/></linearGradient>
      <filter id="thSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="thSofter" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
      <clipPath id="thDoorway"><rect x="1094" y="298" width="130" height="428"/></clipPath>
      <linearGradient id="thWood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B2622"/><stop offset=".5" stop-color="#3C352F"/><stop offset="1" stop-color="#28231F"/></linearGradient>
      <linearGradient id="thLeafFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1EDE5"/><stop offset="1" stop-color="#D9D3C8"/></linearGradient>
      <!-- The traveller: a small hooded walker with a staff and a satchel, seen as a silhouette. Facing right. -->
      <symbol id="thWalker" viewBox="0 0 200 300">
        <path d="M102 34 C116 33 127 42 129 55 C131 62 131 68 127 72 C122 74 118 77 120 84 C128 88 134 94 137 102 C142 122 148 160 152 186 C154 198 156 206 158 214 C140 222 118 225 100 225 C82 225 62 220 48 212 C54 196 60 178 66 162 C62 158 58 150 58 140 C57 126 60 112 70 100 C74 95 77 92 79 88 C78 76 80 60 86 48 C90 40 96 35 102 34 Z"/>
        <path d="M132 104 C142 114 152 128 158 142 C159 148 154 152 150 149 C145 138 137 126 128 118 Z"/>
        <circle cx="156" cy="146" r="5.5"/>
        <path d="M154 94 L180 294" fill="none" stroke-width="4.6" stroke-linecap="round"/>
        <circle cx="154" cy="92" r="4.2"/>
        <path d="M119 219 L135 219 L151 278 L139 283 Z"/>
        <path d="M139 277 L152 274 C160 277 166 283 167 289 C167 293 163 294 158 294 L137 294 C135 288 136 282 139 277 Z"/>
        <path d="M93 219 L109 220 L93 273 L81 268 Z"/>
        <path d="M80 266 L94 272 L93 286 C91 292 84 294 76 293 C70 292 69 288 73 284 L78 278 Z"/>
      </symbol>
      <!-- Rim light on the edges that face the footlights (the back and top of the hood, the pack, the cloak). -->
      <symbol id="thWalkerRim" viewBox="0 0 200 300">
        <path d="M127 54 C125 42 115 33 102 34 C96 35 90 40 86 48 C80 60 78 76 79 88 C77 92 74 95 70 100 C60 112 57 126 58 140 C58 150 62 158 66 162 C60 178 54 196 48 212" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      </symbol>
    </defs>

    <!-- Back wall: curtain with a hem, and a follow-spot pool. -->
    <rect x="0" y="0" width="1440" height="640" fill="url(#thCurtain)"/>
    <rect x="0" y="560" width="1440" height="80" fill="url(#thHem)"/>
    <ellipse cx="660" cy="400" rx="340" ry="300" fill="url(#thSpot)"/>

    <!-- Stage floor. -->
    <path d="M0 640 L1440 640 L1440 900 L0 900 Z" fill="url(#thFloor)"/>
    <g stroke="#5A544B" stroke-width="1.1" opacity=".4"><path d="M0 672 H1440"/><path d="M0 712 H1440"/><path d="M0 762 H1440"/><path d="M0 824 H1440"/></g>
    <path d="M0 640 H1440" stroke="#4A4540" stroke-width="2"/>
    <ellipse cx="560" cy="796" rx="280" ry="56" fill="url(#thPool)"/>

    <!-- The door, stage right: a free-standing frame with depth, a lintel and a stone sill. The doorway
         holds the next Universe's painting; a line of its light shows at the gap and spills on the floor. -->
    <g class="th-door">
      <path d="M1250 290 L1296 300 L1296 728 L1250 732 Z" fill="#000" opacity=".16" filter="url(#thSoft)"/>
      <path class="th-spill" d="M1094 726 L1224 726 L1250 834 L960 834 Z" fill="url(#thSpill)" filter="url(#thSofter)"/>
      <rect x="1094" y="298" width="130" height="428" fill="#151412"/>
      <g clip-path="url(#thDoorway)">
        <image id="thNextArt" href="" x="960" y="298" width="400" height="428" preserveAspectRatio="xMidYMid slice"/>
        <rect x="1094" y="298" width="130" height="428" fill="#FFF8E6" opacity=".1"/>
      </g>
      <rect class="th-glow" x="1092" y="300" width="14" height="424" filter="url(#thSoft)" opacity=".85"/>
      <path d="M1064 288 L1078 280 L1078 728 L1064 734 Z" fill="#1A1815"/>
      <path fill-rule="evenodd" d="M1078 280 H1240 V728 H1078 Z M1094 298 H1224 V726 H1094 Z" fill="url(#thWood)"/>
      <path d="M1094 298 V726" stroke="#574F47" stroke-width="1.6"/>
      <path d="M1094 298 H1224" stroke="#141210" stroke-width="2"/>
      <path d="M1080 282 V726" stroke="#4A433C" stroke-width="1.2"/>
      <rect x="1066" y="266" width="186" height="16" fill="url(#thWood)"/>
      <path d="M1066 266 H1252" stroke="#625950" stroke-width="1.6"/>
      <rect x="1060" y="258" width="198" height="9" fill="#2E2925"/>
      <path d="M1060 258 H1258" stroke="#6A6157" stroke-width="1.2"/>
      <g class="th-leaf">
        <rect x="1094" y="298" width="130" height="428" fill="url(#thLeafFill)"/>
        <rect x="1094" y="298" width="5" height="428" fill="#B9B2A6"/>
        <g fill="#E4DFD6">
          <rect x="1110" y="318" width="98" height="186"/><rect x="1110" y="524" width="98" height="184"/>
        </g>
        <g fill="none" stroke-width="2">
          <path d="M1110 504 V318 H1208" stroke="#FFFFFF" opacity=".8"/><path d="M1208 318 V504 H1110" stroke="#A79F92"/>
          <path d="M1110 708 V524 H1208" stroke="#FFFFFF" opacity=".8"/><path d="M1208 524 V708 H1110" stroke="#A79F92"/>
          <path d="M1118 496 V326 H1200" stroke="#C9C2B6" stroke-width="1.2"/><path d="M1118 700 V532 H1200" stroke="#C9C2B6" stroke-width="1.2"/>
        </g>
        <rect x="1217" y="330" width="7" height="20" rx="1" fill="#857A6B"/><rect x="1217" y="676" width="7" height="20" rx="1" fill="#857A6B"/>
        <rect x="1102" y="498" width="9" height="34" rx="3" fill="#8E7D5F"/>
        <circle cx="1116" cy="515" r="5.5" fill="#6B5C45"/><circle cx="1114.5" cy="513.5" r="1.8" fill="#D9C79F"/>
      </g>
      <rect x="1058" y="726" width="202" height="13" fill="#3A3530"/>
      <path d="M1058 726 H1260" stroke="#6A6258" stroke-width="1.6"/>
    </g>

    <!-- The traveller's shadow on the curtain: light from the front, low and to the left; larger, behind and up to the right. -->
    <g class="th-shadow" fill="#2B2825" stroke="#2B2825" opacity=".34" filter="url(#thSoft)">
      <use href="#thWalker" x="560" y="120" width="380" height="570"/>
    </g>
    <path d="M520 820 L604 820 L770 640 L700 640 Z" fill="#2B2825" opacity=".22" filter="url(#thSoft)"/>

    <!-- The traveller, lit from the front: a dark figure, a warm rim of footlight, and one point of light, the letter. -->
    <g fill="#23211E" stroke="#23211E"><use href="#thWalker" x="452" y="532" width="200" height="300"/></g>
    <g stroke="#EBCB92" opacity=".55"><use href="#thWalkerRim" x="452" y="532" width="200" height="300"/></g>
    <circle cx="566" cy="698" r="22" fill="url(#thLetter)"/>
    <rect x="557" y="689" width="19" height="12" rx="1.5" fill="#F7EBC8" transform="rotate(-14 566 695)"/>
    <path d="M557 690 L566.5 696 L576 689" fill="none" stroke="#C8B78E" stroke-width="1.1" transform="rotate(-14 566 695)"/>

    <rect width="1440" height="900" fill="url(#thDim)"/>
  </svg>
  <div class="th-ui">
    <div class="th-top"><span class="th-mark">TRANSVERSE</span><span class="th-where" id="thresholdTitle">Universe I</span></div>
    <div class="th-bottom"><button id="thresholdOpen" type="button">Open the door</button></div>
  </div>
</section>
